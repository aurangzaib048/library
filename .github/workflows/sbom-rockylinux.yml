# SBOM workflow for Rocky Linux (Docker Official)
#
# Triggers when rockylinux config is updated.
# Extracts SBOM from Docker OCI attestation (SPDX).
# Also picked up by tea-sync hourly for image digest changes.
#
# https://hub.docker.com/_/rockylinux

name: "SBOM: rockylinux"

on:
  # Merging a version bump (or a change to this workflow) uploads the new SBOM
  push:
    branches:
      - master
    paths:
      - 'apps/rockylinux/config.yaml'
      - '.github/workflows/sbom-rockylinux.yml'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no upload)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/sbom-builder.yml
    with:
      app: rockylinux
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    permissions:
      id-token: write
      contents: read
      attestations: write
